<!--Project that has been chosen is To-Do List.The project uses an array to store added tasks.
The addTask() function adds new tasks to the array, and the renderTasks() function uses a loop to show all tasks on the page. 
Jquery is used for clicks and animation, one animation is fading when adding new tasks, hiding the form or removing tasks when deleting them.
The page updates on its own when you add, edit, or delete a task.  -->
